<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ComicCraft - AI Comic Story Creator</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ffe8d6 0%, #d6f3ff 50%, #e0d6ff 100%);
        padding: 24px;
    }
    .card {
        background: #ffffff;
        max-width: 560px;
        width: 100%;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        padding: 36px 40px;
    }
    h1 {
        margin: 0 0 4px 0;
        font-size: 28px;
        color: #2d2340;
    }
    .subtitle {
        margin: 0 0 24px 0;
        color: #6b6480;
        font-size: 14px;
    }
    label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        color: #3a3350;
        margin: 16px 0 6px;
    }
    input[type="text"], select, textarea {
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid #ddd6ee;
        font-size: 14px;
        background: #faf9ff;
        outline: none;
        transition: border-color 0.15s ease;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
        border-color: #8a6fdc;
    }
    textarea { resize: vertical; min-height: 70px; }
    button {
        margin-top: 26px;
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #8a6fdc, #6f9bdc);
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(138,111,220,0.35);
        transition: transform 0.1s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .footnote {
        margin-top: 18px;
        font-size: 12px;
        color: #9a93ad;
        text-align: center;
    }
</style>
</head>
<body>
    <div class="card">
        <h1>🎨 ComicCraft</h1>
        <p class="subtitle">Turn a simple idea into a fully illustrated comic strip, powered by Gemini + Stable Diffusion.</p>

        <form id="comic-form" action="/generate" method="post">
            <label for="story_prompt">Story Prompt</label>
            <textarea id="story_prompt" name="story_prompt" placeholder="e.g. A brave fox exploring an enchanted forest" required></textarea>

            <label for="character_name">Main Character Name</label>
            <input type="text" id="character_name" name="character_name" placeholder="e.g. Finn" required />

            <label for="setting">Setting</label>
            <select id="setting" name="setting" required>
                <option value="forest">Forest</option>
                <option value="school">School</option>
                <option value="space">Space</option>
                <option value="city">City</option>
            </select>

            <label for="tone">Story Tone</label>
            <select id="tone" name="tone" required>
                <option value="light-hearted">Light-hearted</option>
                <option value="dramatic">Dramatic</option>
                <option value="poetic">Poetic</option>
                <option value="funny">Funny</option>
            </select>

            <label for="art_style">Art Style</label>
            <select id="art_style" name="art_style" required>
                <option value="anime">Anime</option>
                <option value="pixel art">Pixel Art</option>
                <option value="comic book">Comic Book</option>
                <option value="realistic">Realistic</option>
            </select>

            <button type="submit" id="submit-btn">Generate My Comic</button>
        </form>
        <p class="footnote">Generation can take a little while the first time a model loads. Please be patient after clicking.</p>
    </div>

    <script>
        document.getElementById('comic-form').addEventListener('submit', function () {
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Creating your comic... please wait';
        });
    </script>
</body>
</html>
